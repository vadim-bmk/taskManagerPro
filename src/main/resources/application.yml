spring:
  security:
    user:
      name: admin
      password: admin
      roles: ROLE_ADMIN
  main:
    allow-circular-references: true
  jpa:
    generate-ddl: true
    open-in-view: true
    show-sql: true
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
      hibernate.default_schema: tmKt_schema
      hibernate:
        format-sql: true
        use_sql_comments: true
  datasource:
    url: jdbc:postgresql://localhost:5432/dvo_db?currentSchema=tmKt_schema
    username: postgres
    password: postgres
    hikari:
      schema: tmKt_schema
      connection-init-sql: CREATE SCHEMA IF NOT EXISTS tmKt_schema
      connection-timeout: 10000